# Gate für PRs nach main (docs/ci-gate-inventar.md, EPIC-P28): schneller Kern —
# lint, typecheck, die check:*-Guards, die schnellen Kern-Tests und der
# PWA-Build. Alles Langsame (Vitest-Dateien über dem Schwellenwert aus
# scripts/slow-tests.json, volle Suite, E2E, K8) läuft auf main und zweimal
# täglich im Zeitplan — siehe nightly.yml. Skips und fehlende
# Voraussetzungen sind dort nie grün (Skip-Bericht je Shard + Aggregation).
name: ci

on:
  pull_request:
    branches: [main]

# Minimalrechte für GITHUB_TOKEN — der Workflow liest nur.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Die Tests setzen tmux, ffmpeg, pdftotext, tesseract und ripgrep voraus;
  # ohne sie wäre verify rot statt aussagekräftig.
  APT_TOOLS: tmux git ffmpeg poppler-utils tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng ripgrep iproute2
  # Runner-sensible Tests (BUG-0163: K8-Lastfall; BUG-0168: Fleet-Dedup-Race)
  # sind auf gehosteter Hardware nicht aussagekräftig — sie skippen sichtbar
  # (it.skipIf) und bleiben lokal im Gate verbindlich.
  AV_HOSTED_RUNNER: "1"

jobs:
  verify:
    # PR-Gate: schneller Kern. Die volle Suite (inkl. Slow-Tests >10 s)
    # fährt nightly.yml auf main und im Zeitplan.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check:commits vergleicht mit origin/main — braucht die volle Historie.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: System-Werkzeuge
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $APT_TOOLS > /dev/null
      - run: npm ci
      - run: npm rebuild esbuild
      - run: npm run check:workspace-links
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:commits
      - run: npm run check:arch
      - run: npm run check:names
      - run: npm run check:adapter-matrix
      - run: npm run check:context
      # AC-P1-6: Secret-Scan als wiederholtes Gate — auch für nachträglich
      # editierte Fixtures, nicht nur zum Capture-Zeitpunkt.
      - run: npm run check:secrets
      # EPIC-P62 T62.2 (AC-P62-5): Medien-Leak-Guard — Struktur immer,
      # OCR (tesseract) über neue/geänderte Guide-/Site-Screenshots.
      - run: npm run check:media
      - run: npm run check:media -- --ocr
      - run: npm -w @ancientvoid/pwa run build
      - name: "Schnelle Kern-Tests (Slow-Liste: scripts/slow-tests.json)"
        run: |
          mkdir -p test-results
          npm run test:fast -- --reporter=junit --reporter=default --outputFile=test-results/vitest-junit.xml
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-junit
          path: test-results/vitest-junit.xml
          retention-days: 14
          if-no-files-found: warn
