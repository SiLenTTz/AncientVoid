stages: [verify]

default:
  image: node:26
  interruptible: true

verify:
  stage: verify
  script:
    # AI-P0-6: packages/workers/test/tmux.test.ts self-skips without tmux
    # (`itTmux = hasTmux ? it : it.skip`) — it always has, silently, on
    # this runner. That's the tmux-backed WorkerRunner (ADR-P0-3, the
    # default runner) going completely unverified in CI. Installing tmux
    # closes the gap instead of just writing it down.
    - apt-get update && apt-get install -y --no-install-recommends tmux
    - npm ci
    - npm rebuild esbuild
    - npm run typecheck
    - npm run lint
    - npm test
    - npm run loadtest -- --sessions 10 --rate 20 --seconds 4
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
