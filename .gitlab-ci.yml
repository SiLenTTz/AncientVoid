# CI nach dem Gate-Inventar (docs/ci-gate-inventar.md, EPIC-P28): jeder Job
# läuft auf dem Projekt-Runner av-docker (ADR-0049) in kurzlebigen
# Containern — unabhängig vom gitlab.com-Kontingent. Alle Teilkommandos von
# `npm run gate` plus PWA-Build und K8-Lasttest sind ausführbar; Skips und
# fehlende Voraussetzungen sind nie grün (Skip-Bericht im e2e-Job).
stages: [verify, e2e]

# 2026-11-12 (Runner-Queue-Vorfall, ci-runbook.md §5): jede MR erzeugte zwei
# bis drei Pipelines (Branch + MR-Event + main), 50 Pending testeten gemergte
# Refs — auf dem geteilten Arbeitsplatzhost sorgte der Ablauf für Swap-Thrash.
# Duplikat-Branch-Pipelines mit offenem MR laufen nie mehr; die MR-Pipeline ist
# die eine Wahrheit.
workflow:
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# Pfade, die Code-Verhalten ändern — nur sie ziehen E2E und K8-Lasttest nach
# sich. Reine Doku (docs/, bugs/, epics/, *.md) braucht beides nicht.
.code-paths: &code-paths
  changes:
    - "apps/**/*"
    - "packages/**/*"
    - "e2e/**/*"
    - "scripts/**/*"
    - "package.json"
    - "package-lock.json"
    - "playwright.config.ts"
    - "vitest.config.ts"
    - ".gitlab-ci.yml"

variables:
  # check:commits vergleicht mit origin/main — GitLabs Default-GIT_DEPTH
  # (50) holt die Refs nicht, der Check würde still skippen. Voller Clone.
  GIT_DEPTH: 0

default:
  image: node:26
  tags: [av-docker]
  interruptible: true

# node:26 hat die Werkzeuge nicht, die die Tests voraussetzen (tmux, ffmpeg,
# pdftotext, tesseract, ripgrep). Ohne sie ist verify rot, auch auf main.
verify:
  stage: verify
  script:
    - node --version && npm --version
    - apt-get update -qq && apt-get install -y -qq tmux git ffmpeg poppler-utils tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng ripgrep > /dev/null
    - npm ci
    - npm rebuild esbuild
    - npm run check:workspace-links
    - npm run typecheck
    - npm run lint
    - npm run check:commits
    - npm run check:arch
    - npm run check:names
    - npm run check:adapter-matrix
    # AC-P1-6 (AI-P1-2): Secret-Scan als wiederholtes Gate — schützt auch
    # manuell hinzugefügte/editierte Fixtures, nicht nur den Capture-Zeitpunkt.
    - npm run check:secrets
    - npm -w @ancientvoid/pwa run build
    - mkdir -p test-results
    - npx vitest run --reporter=junit --reporter=default --outputFile=test-results/vitest-junit.xml
  artifacts:
    when: always
    expire_in: 14 days
    paths: [test-results/vitest-junit.xml]
    reports:
      junit: test-results/vitest-junit.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# K8 in voller Messlatte: 20 Sessions × 30 Events/s × 10 s (nicht entschärft).
# Eigener Job statt Teil von verify (ci-gate-inventar.md): Doku-Änderungen
# zahlen die Last nicht, main immer.
k8:
  stage: verify
  script:
    - node --version && npm --version
    - apt-get update -qq && apt-get install -y -qq tmux git ffmpeg poppler-utils tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng ripgrep > /dev/null
    - npm ci
    - npm rebuild esbuild
    - npm run loadtest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      <<: *code-paths
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH
      <<: *code-paths

# Epic gate (docs/testing-e2e.md): every UI flow against a real hub process
# in Chromium. Blocking — no allow_failure, and Playwright fails loudly when
# the browser is missing instead of skipping. Der Bericht danach macht Skips
# und „null Tests“ zusätzlich sichtbar-rot (EPIC-P28 T28.4).
e2e:
  stage: e2e
  needs: [verify]
  variables:
    PLAYWRIGHT_BROWSERS_PATH: $CI_PROJECT_DIR/.cache/ms-playwright
  script:
    - node --version && npm --version
    - apt-get update -qq && apt-get install -y -qq tmux git ffmpeg poppler-utils tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng ripgrep > /dev/null
    - npm ci
    - npm rebuild esbuild
    - npx playwright install --with-deps chromium
    # Bericht auch bei rotem E2E erzeugen (Fehler-/Skip-Klassifikation als
    # Artefakt); grün ist der Job nur, wenn Playwright UND Bericht grün sind
    # (EPIC-P28 T28.4 — fehlender Bericht ist nie grün).
    - |
      e2e=0
      rep=0
      npm run test:e2e || e2e=$?
      node scripts/ci-e2e-report.mjs || rep=$?
      [ "$e2e" = "0" ] && [ "$rep" = "0" ]
  artifacts:
    when: always
    expire_in: 14 days
    paths: [playwright-report/, test-results/, ci-artifacts/]
    reports:
      junit: test-results/e2e-junit.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      <<: *code-paths
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH
      <<: *code-paths
