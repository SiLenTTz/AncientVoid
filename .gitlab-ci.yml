stages: [verify, e2e]

default:
  image: node:26
  interruptible: true

verify:
  stage: verify
  script:
    - npm ci
    - npm rebuild esbuild
    - npm run typecheck
    - npm -w @uacc/pwa run typecheck
    - npm run lint
    - npm -w @uacc/pwa run build
    - npm test
    - npm run loadtest -- --sessions 10 --rate 20 --seconds 4
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Epic gate (docs/testing-e2e.md): every UI flow against a real hub process
# in Chromium. Blocking — no allow_failure, and Playwright fails loudly when
# the browser is missing instead of skipping.
e2e:
  stage: e2e
  needs: [verify]
  variables:
    PLAYWRIGHT_BROWSERS_PATH: $CI_PROJECT_DIR/.cache/ms-playwright
  script:
    - apt-get update -qq && apt-get install -y -qq tmux git > /dev/null
    - npm ci
    - npm rebuild esbuild
    - npx playwright install --with-deps chromium
    - npm run test:e2e
  artifacts:
    when: always
    expire_in: 14 days
    paths: [playwright-report/, test-results/]
    reports:
      junit: test-results/e2e-junit.xml
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/, .cache/ms-playwright/]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
